name: Deploy Backend via AWS SAM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Adjust if you deploy to a different region

      - name: SAM Build
        run: |
          cd backend
          sam build

      - name: SAM Deploy
        run: |
          cd backend
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name omnisync-backend --resolve-s3 --capabilities CAPABILITY_IAM
